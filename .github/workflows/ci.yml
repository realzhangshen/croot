name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (default features)
        run: cargo check

      - name: cargo check (--no-default-features)
        run: cargo check --no-default-features

      - name: cargo check (--features image-preview)
        run: cargo check --features image-preview

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (--no-default-features)
        run: cargo test --no-default-features

      - name: cargo test (--features image-preview)
        run: cargo test --features image-preview

      - name: cargo clippy (default features)
        run: cargo clippy -- -D warnings

      - name: cargo clippy (--features image-preview)
        run: cargo clippy --features image-preview -- -D warnings

      - name: cargo fmt
        run: cargo fmt --check

  pedantic:
    name: Pedantic (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy --pedantic
        run: |
          cargo clippy -- -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::match_same_arms \
            -A clippy::too_many_lines \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_precision_loss \
            -A clippy::manual_let_else \
            -A clippy::similar_names \
            -A clippy::uninlined_format_args \
            -A clippy::return_self_not_must_use \
            -A clippy::if_same_then_else \
            -A clippy::useless_format \
            -A clippy::derivable_impls \
            -A clippy::map_unwrap_or \
            -A clippy::needless_raw_string_hashes

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (MSRV)
        run: cargo check
