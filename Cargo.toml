[package]
name = "croot"
version = "0.6.1"
edition = "2021"
rust-version = "1.90"
description = "A lightweight terminal file tree sidebar"
license = "MIT"
repository = "https://github.com/realzhangshen/croot"
homepage = "https://realzhangshen.github.io/croot/"
readme = "README.md"
keywords = ["terminal", "file-tree", "tui", "sidebar", "cli"]
categories = ["command-line-utilities"]
authors = ["Zhang Shen"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
tokio = { version = "1", features = ["rt", "macros", "process", "sync", "time", "io-util"] }
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
futures = "0.3"
anyhow = "1"
content_inspector = "0.2"
unicode-width = "0.2"
arboard = "3"
pulldown-cmark = { version = "0.13", default-features = false }
globset = "0.4"
regex = "1"
similar = "3"
shell-words = "1"
trash = "5"
clap_complete = "4"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", optional = true }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[features]
# Image preview is an opt-in feature because it pulls in ratatui-image,
# the `image` crate, and their decoders, which roughly doubles the
# dependency surface for a TUI file browser. Install with
# `cargo install croot --features image-preview` to enable it.
default = []
image-preview = ["dep:ratatui-image", "dep:image"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
tempfile = "3"

[[bench]]
name = "core_ops"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
## Pedantic runs are advisory (`make clippy-pedantic` / CI advisory job).
## Keep low-signal style churn out of the blocking lint gate.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"
if_same_then_else = "allow"
useless_format = "allow"
derivable_impls = "allow"
map_unwrap_or = "allow"
needless_raw_string_hashes = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
manual_let_else = "allow"

[profile.release]
strip = true
lto = "thin"
