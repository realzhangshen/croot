[package]
name = "croot"
version = "0.5.4"
edition = "2021"
rust-version = "1.90"
description = "A lightweight terminal file tree sidebar"
license = "MIT"
repository = "https://github.com/realzhangshen/croot"
homepage = "https://realzhangshen.github.io/croot/"
readme = "README.md"
keywords = ["terminal", "file-tree", "tui", "sidebar", "cli"]
categories = ["command-line-utilities"]
authors = ["Zhang Shen"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
tokio = { version = "1", features = ["rt", "macros", "process", "sync", "time"] }
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
futures = "0.3"
anyhow = "1"
content_inspector = "0.2"
unicode-width = "0.2"
arboard = "3"
pulldown-cmark = { version = "0.12", default-features = false }
globset = "0.4"
regex = "1"
similar = "2"
shell-words = "1"
trash = "5"
clap_complete = "4"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", optional = true }
tree-sitter = "0.26.8"
tree-sitter-highlight = "0.26.8"
tree-sitter-language = "0.1.7"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"

[features]
default = ["image-preview"]
image-preview = ["dep:ratatui-image", "dep:image"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tempfile = "3"

[[bench]]
name = "core_ops"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
## Pedantic runs are advisory (`make clippy-pedantic` / CI advisory job).
## Keep low-signal style churn out of the blocking lint gate.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"
if_same_then_else = "allow"
useless_format = "allow"
derivable_impls = "allow"
map_unwrap_or = "allow"
needless_raw_string_hashes = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
manual_let_else = "allow"

[profile.release]
strip = true
lto = "thin"
